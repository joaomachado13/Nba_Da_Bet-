<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E7A400">
  <title>Sem conexão · NBADABET</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#FBF8EF;color:#20242D;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,430px);padding:28px;border:1px solid #E8D38F;border-radius:20px;background:#fffdf7;box-shadow:0 12px 40px rgba(56,43,7,.08);text-align:center}
    img{width:76px;height:76px;border-radius:18px}small{display:block;margin-top:18px;color:#9A7409;font-weight:850;letter-spacing:.08em}h1{margin:7px 0 10px;font-size:28px}
    p{margin:0;color:#6D6F78;font-size:13px;line-height:1.55}strong{color:#20242D}
    button,a{width:100%;min-height:48px;margin-top:18px;display:grid;place-items:center;border:1px solid #C99000;border-radius:12px;background:#E7A400;color:#241A04;font:inherit;font-weight:850;text-decoration:none;cursor:pointer}
    a{margin-top:9px;background:#fff;border-color:#DED7C8;color:#4A4B52}
  </style>
</head>
<body>
  <main>
    <img src="/assets/icons/icon-192.png" alt="">
    <small>NBADABET</small>
    <h1>Você está offline</h1>
    <p>A interface pode continuar disponível, mas <strong>palpites, ranking e resultados precisam de internet</strong>. Nenhum palpite é considerado enviado enquanto você estiver sem conexão.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
    <a href="/index.html">Voltar para o início</a>
  </main>
</body>
</html>
