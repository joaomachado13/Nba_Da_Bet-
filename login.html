<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#E7A400" />
  <title>Entrar · Bolão NBA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/room.css" />
</head>
<body class="auth-page room-entry-page">
  <main class="auth-card room-entry-card">
    <img class="nba-auth-logo" src="https://cdn.nba.com/logos/leagues/logo-nba-logoman.svg" alt="NBA">
    <p class="eyebrow">BOLÃO NBA · TEMPORADA 26/27</p>
    <h1>Entrar no bolão</h1>
    <p class="auth-copy">Use o mesmo e-mail cadastrado e o código da sala. Depois, este navegador permanece conectado.</p>

    <form id="loginForm" class="auth-form room-form">
      <label for="playerEmail">Seu e-mail</label>
      <input id="playerEmail" type="email" required maxlength="120" placeholder="voce@email.com" autocomplete="email" inputmode="email" />

      <label for="roomCode">Senha da sala</label>
      <input id="roomCode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" required placeholder="••••" autocomplete="current-password" />

      <button class="primary-button" type="submit">Entrar</button>
    </form>

    <div class="room-note">
      <span aria-hidden="true">●</span>
      <p><strong>Acesso fechado.</strong> Novos cadastros estão encerrados. Quem já participa entra com o e-mail cadastrado e a senha da sala.</p>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
